services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - devtask-data:/data
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/devtask.sqlite
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # During Docker Compose, the frontend talks to backend over the Docker network
        VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devtask-data:
    driver: local
